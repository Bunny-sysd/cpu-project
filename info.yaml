# Tiny Tapeout project information
project:
  title:        "Cipher CPU"      # Project title
  author:       "Aaron"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit accumulator CPU with 16 bytes of memory, running a toy stream cipher"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bunny_sysd_cipher_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_bunny_sysd_cipher_cpu.v"
    - "program_counter.v"
    - "instruction_register.v"
    - "memory.v"
    - "alu.v"
    - "accumulator.v"
    - "control_unit.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Outputs
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "DATA_OUT[6]"
  uo[7]: "DATA_OUT[7]"

  # Bidirectional pins
  uio[0]: "LOAD_ADDR[0] (in)"
  uio[1]: "LOAD_ADDR[1] (in)"
  uio[2]: "LOAD_ADDR[2] (in)"
  uio[3]: "LOAD_ADDR[3] (in)"
  uio[4]: "LOAD (in)"
  uio[5]: "WRITE (in)"
  uio[6]: "READY (in)"
  uio[7]: "VALID (out)"

# Do not change!
yaml_version: 6
