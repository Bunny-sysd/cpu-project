; PlatformIO project for the Heltec WiFi LoRa 32 V3 board.
;
;   python -m platformio run                  compile
;   python -m platformio run -t upload        compile and flash a connected board
;   python -m platformio device monitor       watch the board's log output
;
; Run these from inside mesh/firmware.

[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0

; The mesh logic and crypto library live outside this folder so the PC tests
; and the board use the very same files.
build_flags =
    -I../core
    -I../vendor/monocypher
build_src_filter =
    +<*>
    +<../../core/*.cpp>
    +<../../vendor/monocypher/monocypher.c>
